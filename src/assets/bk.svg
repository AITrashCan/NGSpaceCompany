<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient: deep night to mystic purple -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="35%" stop-color="#0f0c29"/>
      <stop offset="65%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <!-- Mist gradient -->
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ecae6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#8ecae6" stop-opacity="0.12"/>
    </linearGradient>
    <!-- Qi stream glow -->
    <linearGradient id="qiStream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b68ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#9d8cff" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#b8a9ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7b68ee" stop-opacity="0"/>
    </linearGradient>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe6" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#fffbe6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fffbe6" stop-opacity="0"/>
    </radialGradient>
    <!-- Mountain mist -->
    <linearGradient id="mtnMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1040" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a1040" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Pagoda glow -->
    <radialGradient id="pagodaGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ffcc44" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffcc44" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Stars — scattered across sky -->
  <g opacity="0.8">
    <circle cx="120" cy="80" r="1" fill="#fff"/>
    <circle cx="340" cy="45" r="1.2" fill="#fff"/>
    <circle cx="580" cy="120" r="0.8" fill="#e8e0ff"/>
    <circle cx="790" cy="30" r="1" fill="#fff"/>
    <circle cx="1020" cy="95" r="1.3" fill="#ffe8c0"/>
    <circle cx="1250" cy="55" r="0.9" fill="#fff"/>
    <circle cx="1480" cy="110" r="1.1" fill="#e0e8ff"/>
    <circle cx="1700" cy="40" r="1" fill="#fff"/>
    <circle cx="200" cy="200" r="0.7" fill="#fff"/>
    <circle cx="450" cy="180" r="1" fill="#ffe8c0"/>
    <circle cx="680" cy="220" r="0.9" fill="#fff"/>
    <circle cx="900" cy="170" r="1.2" fill="#e8e0ff"/>
    <circle cx="1130" cy="210" r="0.8" fill="#fff"/>
    <circle cx="1350" cy="190" r="1.1" fill="#fff"/>
    <circle cx="1580" cy="230" r="0.7" fill="#ffe8c0"/>
    <circle cx="1800" cy="175" r="1" fill="#fff"/>
    <circle cx="70" cy="310" r="0.8" fill="#fff"/>
    <circle cx="290" cy="350" r="1" fill="#e0e8ff"/>
    <circle cx="520" cy="290" r="0.6" fill="#fff"/>
    <circle cx="760" cy="330" r="1.1" fill="#fff"/>
    <circle cx="980" cy="280" r="0.9" fill="#ffe8c0"/>
    <circle cx="1200" cy="340" r="0.7" fill="#fff"/>
    <circle cx="1430" cy="300" r="1" fill="#e8e0ff"/>
    <circle cx="1650" cy="360" r="1.2" fill="#fff"/>
    <circle cx="1850" cy="290" r="0.8" fill="#fff"/>
    <circle cx="160" cy="430" r="1" fill="#fff"/>
    <circle cx="400" cy="460" r="0.7" fill="#fff"/>
    <circle cx="630" cy="410" r="1.1" fill="#ffe8c0"/>
    <circle cx="870" cy="440" r="0.9" fill="#fff"/>
    <circle cx="1100" cy="400" r="0.8" fill="#e8e0ff"/>
    <circle cx="1330" cy="450" r="1" fill="#fff"/>
    <circle cx="1560" cy="420" r="0.7" fill="#fff"/>
    <circle cx="1780" cy="470" r="1.1" fill="#ffe8c0"/>
    <circle cx="50" cy="550" r="0.9" fill="#fff"/>
    <circle cx="310" cy="520" r="1" fill="#fff"/>
    <circle cx="550" cy="570" r="0.8" fill="#e0e8ff"/>
    <circle cx="1050" cy="540" r="0.9" fill="#fff"/>
    <circle cx="1500" cy="560" r="1" fill="#fff"/>
    <circle cx="1750" cy="530" r="0.7" fill="#ffe8c0"/>
  </g>

  <!-- Bright stars with glow -->
  <g filter="url(#blur2)" opacity="0.7">
    <circle cx="340" cy="45" r="3" fill="#fff"/>
    <circle cx="1020" cy="95" r="4" fill="#ffe8c0"/>
    <circle cx="1650" cy="360" r="3" fill="#fff"/>
    <circle cx="870" cy="440" r="3.5" fill="#e8e0ff"/>
  </g>

  <!-- Moon with glow -->
  <circle cx="1500" cy="150" r="180" fill="url(#moonGlow)"/>
  <circle cx="1500" cy="150" r="50" fill="#fffbe6" opacity="0.9"/>
  <circle cx="1500" cy="150" r="50" fill="#fff5cc" opacity="0.3" filter="url(#blur8)"/>
  <!-- Moon craters subtle -->
  <circle cx="1488" cy="138" r="6" fill="#f0e6b0" opacity="0.3"/>
  <circle cx="1512" cy="155" r="4" fill="#f0e6b0" opacity="0.25"/>
  <circle cx="1495" cy="162" r="3" fill="#f0e6b0" opacity="0.2"/>

  <!-- Qi streams — flowing energy ribbons across the sky -->
  <g filter="url(#blur4)">
    <path d="M0,400 Q300,350 600,380 T1200,360 T1920,390" stroke="url(#qiStream)" stroke-width="40" fill="none"/>
    <path d="M0,500 Q400,460 800,490 T1600,470 T1920,500" stroke="url(#qiStream)" stroke-width="30" fill="none" opacity="0.6"/>
    <path d="M0,320 Q200,290 500,310 T1000,300 T1920,330" stroke="url(#qiStream)" stroke-width="20" fill="none" opacity="0.4"/>
  </g>

  <!-- Far mountains — misty silhouettes -->
  <g opacity="0.35" fill="#2a1e5e">
    <path d="M0,700 L80,620 L160,680 L280,580 L380,650 L480,560 L580,640 L680,550 L780,630 L880,570 L980,650 L1080,580 L1180,640 L1280,550 L1380,620 L1480,570 L1580,640 L1680,580 L1780,650 L1880,600 L1920,640 L1920,1080 L0,1080 Z"/>
  </g>

  <!-- Mid mountains — with pagoda silhouettes -->
  <g opacity="0.5" fill="#221850">
    <path d="M0,780 L60,720 L140,760 L220,680 L300,740 L380,660 L460,730 L520,690 L600,740 L680,670 L760,730 L840,680 L920,740 L1000,690 L1080,740 L1160,670 L1240,730 L1320,680 L1400,740 L1480,690 L1560,740 L1640,680 L1720,730 L1800,690 L1880,730 L1920,700 L1920,1080 L0,1080 Z"/>
  </g>

  <!-- Pagoda on mid-mountain (left area) -->
  <g transform="translate(380,610)" opacity="0.6" fill="#2a1e5e">
    <!-- Pagoda body -->
    <rect x="-8" y="-60" width="16" height="60"/>
    <!-- Roof layers -->
    <polygon points="-20,-60 20,-60 0,-72"/>
    <polygon points="-16,-48 16,-48 0,-58"/>
    <polygon points="-12,-36 12,-36 0,-45"/>
    <!-- Spire -->
    <line x1="0" y1="-72" x2="0" y2="-82" stroke="#2a1e5e" stroke-width="2"/>
  </g>

  <!-- Pagoda on mid-mountain (right area) -->
  <g transform="translate(1400,640)" opacity="0.55" fill="#2a1e5e">
    <rect x="-6" y="-45" width="12" height="45"/>
    <polygon points="-15,-45 15,-45 0,-55"/>
    <polygon points="-11,-35 11,-35 0,-43"/>
    <line x1="0" y1="-55" x2="0" y2="-63" stroke="#2a1e5e" stroke-width="1.5"/>
  </g>

  <!-- Floating pagoda (in the sky — 仙阁) -->
  <g transform="translate(900,380)" opacity="0.45" fill="#3a2a70">
    <!-- Cloud base -->
    <ellipse cx="0" cy="20" rx="35" ry="8" fill="#3a2a70" opacity="0.4"/>
    <!-- Pagoda body -->
    <rect x="-10" y="-40" width="20" height="55"/>
    <!-- Roof layers -->
    <polygon points="-25,-40 25,-40 0,-55"/>
    <polygon points="-20,-28 20,-28 0,-40"/>
    <polygon points="-15,-18 15,-18 0,-28"/>
    <!-- Spire -->
    <line x1="0" y1="-55" x2="0" y2="-68" stroke="#3a2a70" stroke-width="2"/>
    <!-- Glow beneath -->
    <ellipse cx="0" cy="25" rx="25" ry="5" fill="#ffcc44" opacity="0.25" filter="url(#blur4)"/>
  </g>

  <!-- Near mountains — dark foreground -->
  <g opacity="0.7" fill="#18102e">
    <path d="M0,860 L100,800 L200,840 L320,770 L440,830 L540,760 L640,820 L740,750 L840,810 L940,760 L1040,820 L1140,770 L1240,830 L1340,760 L1440,820 L1540,770 L1640,830 L1740,780 L1840,830 L1920,790 L1920,1080 L0,1080 Z"/>
  </g>

  <!-- Mist layer over mountains -->
  <rect x="0" y="650" width="1920" height="430" fill="url(#mist)"/>

  <!-- Foreground mist wisps -->
  <g filter="url(#blur8)" opacity="0.15" fill="#8ecae6">
    <ellipse cx="300" cy="780" rx="250" ry="20"/>
    <ellipse cx="800" cy="820" rx="300" ry="25"/>
    <ellipse cx="1400" cy="790" rx="280" ry="22"/>
    <ellipse cx="1800" cy="830" rx="200" ry="18"/>
  </g>

  <!-- Bottom fade to solid dark -->
  <rect x="0" y="950" width="1920" height="130" fill="#0a0a1a" opacity="0.5"/>
</svg>